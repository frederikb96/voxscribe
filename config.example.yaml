# Voxscribe Configuration

log_level: info

# Command printing the ElevenLabs API key on stdout, for a key kept in a password store.
# Leave empty to read ELEVENLABS_API_KEY from the environment instead.
api_key_command: ""

# Language hint (ISO-639-1 code, e.g., "en", "de") - leave empty for auto-detection
language: en

# Max seconds to wait for final transcription after stopping recording
transcription_timeout: 120

# ElevenLabs Scribe v2 Realtime settings
elevenlabs:
  vad_silence_threshold_secs: 1.5
  vad_threshold: 0.4
  enable_logging: false

# Client-side silence gate: skip sending near-silent audio to reduce streaming cost
silence_gate:
  enabled: false
  threshold: 0.010
  gap_seconds: 3.0
